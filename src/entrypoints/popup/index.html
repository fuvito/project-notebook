<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Notebook</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Inter Variable', 'Inter', system-ui, -apple-system, sans-serif;
        font-feature-settings: 'liga' 1, 'calt' 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* TipTap editor content styles */
      .tiptap { flex: 1; display: flex; flex-direction: column; cursor: text; }
      .notebook-editor { flex: 1; outline: none; }
      .notebook-editor p { margin: 0.2rem 0; line-height: 1.6; font-size: 0.875rem; color: #111827; }
      .notebook-editor h1 { font-size: 1.2rem; font-weight: 700; margin: 0.875rem 0 0.3rem; color: #111827; line-height: 1.3; }
      .notebook-editor h2 { font-size: 1.05rem; font-weight: 600; margin: 0.75rem 0 0.25rem; color: #111827; line-height: 1.3; }
      .notebook-editor h3 { font-size: 0.9375rem; font-weight: 600; margin: 0.625rem 0 0.2rem; color: #111827; line-height: 1.3; }
      .notebook-editor ul { padding-left: 1.35rem; margin: 0.2rem 0; }
      .notebook-editor li { margin: 0.15rem 0; line-height: 1.6; font-size: 0.875rem; }
      .notebook-editor strong { font-weight: 600; }
      .notebook-editor em { font-style: italic; }
      .notebook-editor code { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 0.8125rem; background: #F3F4F6; padding: 0.1em 0.3em; border-radius: 3px; }
      .notebook-editor a.notebook-link { color: #4F46E5; text-decoration: underline; cursor: pointer; word-break: break-all; }
      .notebook-editor a.notebook-link:hover { opacity: 0.8; }
      .notebook-editor p.is-editor-empty:first-child::before {
        content: attr(data-placeholder);
        color: #9CA3AF;
        pointer-events: none;
        float: left;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
